[project]
name = "development-template"
version = "0.1.0"
description = "Personal Python & SQL prototyping environment"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.2",
    "pandas>=2.2",
    "jupyterlab>=4.5.7",
    "ipykernel>=6.0",
    "python-dotenv>=1.0",
    "ruff>=0.9",
    "seaborn>=0.13.2",
    "numpy>=2.4.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
